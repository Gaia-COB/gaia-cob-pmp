services:
  # Not secured, as certificates are handled on Pandora.
  nginx:
    restart: always
    container_name: gaia-nginx
    image: nginx:1.23-alpine
    ports:
      - 80:80
    volumes:
      - type: bind
        source: "./deploy/nginx/pandora.conf"
        target: "/etc/nginx/conf.d/default.conf"
      - type: bind
        source: "./gaia_cob_pmp/logs/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/logs/"
      - type: bind
        source: "./gaia_cob_pmp/staticfiles/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/staticfiles/"

  # Web server
  server:
    restart: unless-stopped
    container_name: gaia-server
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8888:8888
    env_file:
      - "./.env.default"
      - "./.env"
    command:
      - "bash"
      - "docker-entrypoint.sh"
    volumes:
      - type: bind
        source: "./gaia_cob_pmp/media/uploads/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/media/uploads/"
      - type: bind
        source: "./gaia_cob_pmp/staticfiles/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/staticfiles/"
      - type: bind
        source: "./gaia_cob_pmp/logs/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/logs/"


  web-dev:
    restart: unless-stopped
    container_name: gaia-server-dev
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 8888:8888
    env_file:
      - "./.env.default"
      - "./.env"
    command:
      - "bash"
      - "docker-entrypoint.sh"
    volumes:
      - type: bind
        source: "./gaia_cob_pmp/media/uploads/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/media/uploads/"
      - type: bind
        source: "./gaia_cob_pmp/staticfiles/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/staticfiles/"
      - type: bind
        source: "./gaia_cob_pmp/logs/"
        target: "/var/www/gaia-cob-pmp/gaia_cob_pmp/logs/"

